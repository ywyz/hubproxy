services:
  hubproxy:
    build: .
    image: hubproxy:local
    container_name: hubproxy
    restart: always
    environment:
      - HUBPROXY_DOWNLOAD_USERNAME
      - HUBPROXY_DOWNLOAD_PASSWORD
    ports:
      - "5000:5000"
    volumes:
      - ./src/config.toml:/app/config.toml:ro
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "3"
