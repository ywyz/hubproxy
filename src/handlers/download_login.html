<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载账户 · HubProxy</title>
  <style>
    :root { color-scheme: light dark; font: 1rem/1.6 system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(23rem, calc(100% - 3rem)); padding: 3rem 0; }
    h1 { font-size: 1.75rem; margin: .2rem 0 1rem; }
    label { display: grid; gap: .25rem; margin: 1rem 0; }
    input, button { font: inherit; padding: .55rem .75rem; border-radius: .4rem; }
    input { border: 1px solid GrayText; }
    button { border: 0; background: #244db1; color: white; cursor: pointer; }
  </style>
</head>
<body><main>
  <span>HubProxy</span>
  <h1>下载账户</h1>
  {{if .Disabled}}
    <p>下载账户未启用。请联系管理员配置账号后再下载大文件。</p>
  {{else if .Authenticated}}
    <p>已登录。重新打开原下载链接即可继续。</p>
    <form method="post" action="/logout"><button type="submit">退出登录</button></form>
  {{else}}
    {{if .Message}}<p role="alert">{{.Message}}</p>{{end}}
    <form method="post" action="/login">
      <label>用户名<input name="username" required autocomplete="username"></label>
      <label>密码<input type="password" name="password" required autocomplete="current-password"></label>
      <button type="submit">登录</button>
    </form>
    <p>使用 IDM 时，可在“站点登录”中为本站的 HTTPS 地址保存同一组账号和密码。</p>
  {{end}}
</main></body>
</html>
