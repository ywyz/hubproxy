[server]
# 可通过 CONFIG_PATH 环境变量指定配置文件路径，默认读取当前工作目录下的 config.toml
host = "0.0.0.0"
# 监听端口
port = 5000
# 匿名单文件下载上限（字节），最多 2 GiB；登录后不限大小
fileSize = 2147483648
# HTTP/2 多路复用
enableH2C = false
enableFrontend = true

[rateLimit]
# 每个IP每周期允许的请求数
requestLimit = 500
# 限流周期（小时）
periodHours = 3.0

[security]
# IP白名单，支持单个IP或IP段
# 白名单中的IP不受限流限制
whiteList = [
    "127.0.0.1",
    "127.0.0.2"
]

# IP黑名单，支持单个IP或IP段
# 黑名单中的IP将被直接拒绝访问
blackList = [
    "192.168.100.1",
    "192.168.100.0/24"
]

[access]
# 代理服务白名单（支持GitHub仓库和Docker镜像，支持通配符）
# 只允许访问白名单中的仓库/镜像，为空时不限制
whiteList = []

# 代理服务黑名单（支持GitHub仓库和Docker镜像，支持通配符）
# 禁止访问黑名单中的仓库/镜像
blackList = [
    "baduser/malicious-repo",
    "*/malicious-repo",
    "baduser/*"
]

# 镜像源和通用 HTTPS 直链共用此白名单。清空数组即可关闭这两种入口。
directLinkWhiteList = [
    # Ubuntu APT：主仓库、安全更新、其他架构
    "archive.ubuntu.com/ubuntu/*",
    "security.ubuntu.com/ubuntu/*",
    "ports.ubuntu.com/ubuntu-ports/*",
    # Debian APT：主仓库、安全更新与官方列出的 Fastly 端点
    "deb.debian.org/debian/*",
    "deb.debian.org/debian-security/*",
    "security.debian.org/debian-security/*",
    "cdn-fastly.deb.debian.org/debian/*",
    "cdn-fastly.deb.debian.org/debian-security/*",
    # Omarchy stable（x86_64）
    "pkgs.omarchy.org/stable/x86_64/*",
    "stable-mirror.omarchy.org/core/os/x86_64/*",
    "stable-mirror.omarchy.org/extra/os/x86_64/*",
    "stable-mirror.omarchy.org/multilib/os/x86_64/*",
    # Arch Linux（x86_64）
    "geo.mirror.pkgbuild.com/core/os/x86_64/*",
    "geo.mirror.pkgbuild.com/extra/os/x86_64/*",
    "geo.mirror.pkgbuild.com/multilib/os/x86_64/*",
    # Alpine：仅开放指定稳定版本的软件包目录
    "dl-cdn.alpinelinux.org/alpine/v3.22/main/*",
    "dl-cdn.alpinelinux.org/alpine/v3.22/community/*",
    "dl-cdn.alpinelinux.org/alpine/v3.23/main/*",
    "dl-cdn.alpinelinux.org/alpine/v3.23/community/*",
    "dl-cdn.alpinelinux.org/alpine/v3.24/main/*",
    "dl-cdn.alpinelinux.org/alpine/v3.24/community/*",
    "dl-cdn.alpinelinux.org/alpine/latest-stable/main/*",
    "dl-cdn.alpinelinux.org/alpine/latest-stable/community/*",
    # Rocky Linux：主版本目录可随小版本更新继续使用
    "dl.rockylinux.org/pub/rocky/9/BaseOS/*",
    "dl.rockylinux.org/pub/rocky/9/AppStream/*",
    "dl.rockylinux.org/pub/rocky/9/extras/*",
    "dl.rockylinux.org/pub/rocky/10/BaseOS/*",
    "dl.rockylinux.org/pub/rocky/10/AppStream/*",
    "dl.rockylinux.org/pub/rocky/10/extras/*",
]

# 通用 HTTPS 直链黑名单；仅在白名单允许后用于排除具体域名或路径
directLinkBlackList = []

# 代理配置，支持有用户名/密码认证和无认证模式
# 无认证: socks5://127.0.0.1:1080
# 有认证: socks5://username:password@127.0.0.1:1080
# 留空不使用代理
proxy = "" 

[download]
# 批量下载离线镜像数量限制
maxImages = 10

[downloadAuth]
# 本地下载登录账号，用户名和密码都配置后才会启用下载登录；不设默认密码
# 可通过环境变量 HUBPROXY_DOWNLOAD_USERNAME / HUBPROXY_DOWNLOAD_PASSWORD 覆盖
username = ""
password = ""

# Registry映射配置，支持多种镜像仓库上游
[registries]

# GitHub Container Registry
[registries."ghcr.io"]
upstream = "ghcr.io"
authHost = "ghcr.io/token" 
authType = "github"
enabled = true

# Google Container Registry
[registries."gcr.io"]
upstream = "gcr.io"
authHost = "gcr.io/v2/token"
authType = "google"
enabled = true

# Quay.io Container Registry
[registries."quay.io"]
upstream = "quay.io"
authHost = "quay.io/v2/auth"
authType = "quay"
enabled = true

# Kubernetes Container Registry
[registries."registry.k8s.io"]
upstream = "registry.k8s.io"
authHost = "registry.k8s.io"
authType = "anonymous"
enabled = true

[tokenCache]
# 是否启用缓存(同时控制Token和Manifest缓存)显著提升性能
enabled = true
# 默认缓存时间(分钟)
defaultTTL = "20m"
